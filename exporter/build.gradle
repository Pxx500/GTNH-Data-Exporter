plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

version = '0.1.0'
ext.modVersion = version

dependencies {
    implementation('com.github.GTNewHorizons:GT5-Unofficial:5.09.54.221:dev')
    implementation('com.github.GTNewHorizons:NotEnoughItems:2.8.159-GTNH:dev')
    implementation('com.github.GTNewHorizons:EnderIO:2.10.49:dev')
    implementation('com.github.GTNewHorizons:ForestryMC:4.11.39:dev')
    implementation('com.github.GTNewHorizons:Botania:1.13.38-GTNH:dev')
    testImplementation('junit:junit:4.13.2')
}

tasks.named('processResources') {
    from(['../LICENSE', '../COPYING', 'THIRD_PARTY_NOTICES.md']) {
        into('META-INF')
    }
}

tasks.named('sourcesJar') {
    from(['../LICENSE', '../COPYING', 'THIRD_PARTY_NOTICES.md']) {
        into('META-INF')
    }
}

tasks.named('runFullPack') {
    dependsOn('build')
    if (providers.gradleProperty('dataAutorun').getOrElse('false').toBoolean()) {
        extraJvmArgs.addAll(
            '-Dgtnh.data.autorun=true',
            '-Dgtnh.data.outputDir=' + providers.gradleProperty('dataOutputDir').getOrElse(layout.buildDirectory.dir('snapshot').get().asFile.absolutePath)
        )
    }
    if (providers.gradleProperty('dataNeiReference').getOrElse('false').toBoolean()) {
        def referenceScope = providers.gradleProperty('dataNeiReferenceScope').getOrElse('all')
        if (!(referenceScope in ['all', 'forestry_still'])) {
            throw new GradleException('dataNeiReferenceScope must be all or forestry_still')
        }
        extraJvmArgs.add('-Dgtnh.data.neiReference=true')
        if (referenceScope == 'forestry_still') {
            extraJvmArgs.add('-Dgtnh.data.neiReferenceScope=forestry_still')
        }
    }
    if (providers.gradleProperty('dataNativeRecipeCallsites').getOrElse('false').toBoolean()) {
        extraJvmArgs.add('-Dgt.recipe.lookup.validate.capture_callsite=true')
    }
}
