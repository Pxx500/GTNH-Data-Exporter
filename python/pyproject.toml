[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtnh-data"
version = "0.1.0"
description = "Canonical GTNH snapshot validation and offline queries"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING"]
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "mcp==2.3.0", "sympy==1.14.0"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
gtnh-data = "gtnh_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtnh_data = ["ui_dist/**/*"]
